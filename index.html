<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0e7a6d">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="超慢跑節拍器">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>超慢跑節拍器</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app-shell" aria-label="超慢跑節拍器">
    <section class="tempo-panel" id="gestureZone" aria-label="步頻控制區">
      <p class="kicker">超慢跑節拍器</p>
      <div class="tempo-readout">
        <button class="icon-button" id="tempoDown" type="button" aria-label="減少每分鐘 10 步">-</button>
        <div>
          <output class="tempo-value" id="tempoValue" aria-live="polite">180</output>
          <p class="tempo-unit">步 / 分鐘</p>
        </div>
        <button class="icon-button" id="tempoUp" type="button" aria-label="增加每分鐘 10 步">+</button>
      </div>
      <input id="tempoRange" class="range" type="range" min="160" max="200" step="1" value="180" aria-label="設定每分鐘步頻">
      <div class="tempo-tools" aria-label="步頻操作介面">
        <button class="small-button" id="tempoFineDown" type="button">-1</button>
        <button class="preset-button" type="button" data-tempo-preset="160">160</button>
        <button class="preset-button" type="button" data-tempo-preset="180">180</button>
        <button class="preset-button" type="button" data-tempo-preset="200">200</button>
        <button class="small-button" id="tempoFineUp" type="button">+1</button>
      </div>
      <div class="voice-control">
        <div class="voice-actions">
          <button class="voice-button hands-free-button" id="handsFreeButton" type="button">免持模式</button>
          <button class="voice-button" id="voiceButton" type="button" aria-pressed="false">語音調整</button>
        </div>
        <p id="voiceStatus" class="voice-status">說「快一點」+10，說「慢一點」-10</p>
      </div>
    </section>

    <section class="timer-panel" aria-label="計時設定">
      <div class="time-display">
        <span id="timeRemaining">20:00</span>
        <small id="timerStatus">尚未開始</small>
      </div>
      <label class="field-label" for="minutesRange">計時分鐘</label>
      <input id="minutesRange" class="range" type="range" min="0" max="120" step="1" value="20" aria-label="設定計時分鐘">
      <div class="minutes-row">
        <button class="small-button" id="minuteDown" type="button">-5</button>
        <output id="minutesValue">20 分鐘</output>
        <button class="small-button" id="minuteUp" type="button">+5</button>
      </div>
    </section>

    <section class="sound-panel" aria-label="音頻選擇">
      <p class="section-title">節拍音色</p>
      <div class="sound-grid" role="radiogroup" aria-label="選擇節拍音色">
        <label class="sound-option">
          <input type="radio" name="sound" value="woodBlock" checked>
          <span>木魚</span>
        </label>
        <label class="sound-option">
          <input type="radio" name="sound" value="bronzeBell">
          <span>金屬銅鈴</span>
        </label>
        <label class="sound-option">
          <input type="radio" name="sound" value="glassChime">
          <span>玻璃風鈴</span>
        </label>
        <label class="sound-option">
          <input type="radio" name="sound" value="ceramicXylophone">
          <span>陶器鐵琴</span>
        </label>
      </div>
    </section>

    <section class="controls" aria-label="播放控制">
      <button class="control-button secondary" id="stopButton" type="button">停止</button>
      <button class="control-button secondary" id="pauseButton" type="button">暫停</button>
      <button class="control-button primary" id="startButton" type="button">開始</button>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
